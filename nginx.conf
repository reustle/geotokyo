server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SvelteKit's static adapter writes /meetups -> meetups.html; serve clean URLs.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed build assets are immutable.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /maps.xml { types { } default_type "application/rss+xml; charset=utf-8"; }
    location = /maps.json { types { } default_type "application/json; charset=utf-8"; }

    error_page 404 /404.html;
}
